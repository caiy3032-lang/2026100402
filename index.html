<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小恐龍跑酷</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    color: #535353;
    user-select: none;
  }
  #game {
    width: 100%;
    max-width: 800px;
    background: #f7f7f7;
    border-radius: 8px;
    touch-action: none;
    transition: filter 0.8s;
  }
  #game.night { filter: invert(1); }
  .help { margin-top: 14px; font-size: 0.95rem; text-align: center; line-height: 1.7; }
  kbd {
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .open-skins {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #fff;
  }
  .open-skins:hover { border-color: #535353; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  /* 造型頁面 */
  .skin-page {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .skin-page[hidden] { display: none; }
  .skin-panel {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    min-width: 0;
    max-width: 640px;
    max-height: 100%;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }
  .skin-panel h2 { margin: 0 0 4px; }
  .skin-panel p { margin: 0 0 6px; color: #888; font-size: 0.9rem; }
  .skin-coins { font-size: 1.05rem; font-weight: bold; margin: 8px 0 4px; }
  .skin-msg { min-height: 1.4em; margin: 0 0 10px; font-size: 0.9rem; }
  .skin-msg.error { color: #e53935; }
  .skin-msg.ok { color: #43a047; }
  .skin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 12px;
  }
  .skin-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px 10px;
    border: 2px solid #e5e5e5;
    border-radius: 10px;
    background: #fafafa;
    transition: transform 0.1s, border-color 0.1s;
  }
  .skin-card:hover { transform: translateY(-2px); border-color: #bbb; }
  .skin-card.active { border-color: #535353; background: #fff; font-weight: bold; }
  .skin-card.active::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 0.9rem;
  }
  .skin-card canvas { width: 80px; height: 64px; border-radius: 6px; }
  .skin-card.locked canvas { opacity: 0.35; }
  .skin-card.locked::before {
    content: '🔒';
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.4rem;
  }
  .skin-card.shake { animation: shake 0.3s; }
  @keyframes shake {
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .price { color: #f9a825; font-weight: bold; }
  .skin-name { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
  .close-btn {
    margin-top: 20px;
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    background: #535353;
    color: #fff;
  }
  .close-btn:hover { background: #333; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button class="open-skins" id="skin-open"></button>
<div class="help">
  <kbd>空白鍵</kbd> / <kbd>↑</kbd> / 點擊畫面：跳躍（按住跳更高）<br>
  <kbd>↓</kbd>：蹲下（空中按可快速落地）<br>
  <kbd>1</kbd>~<kbd>7</kbd>：快速切換已解鎖的造型　🪙 吃金幣（高處的要跳起來吃），可在造型頁面解鎖新顏色<br>
  ⚠️ 重新整理網頁後，金幣與解鎖的造型都會重置
</div>

<div class="skin-page" id="skin-page" hidden>
  <div class="skin-panel">
    <h2>🎨 選擇造型</h2>
    <p>點選已解鎖的顏色來換造型，鎖住的造型要用金幣解鎖（遊戲會先暫停）</p>
    <div class="skin-coins" id="skin-coins"></div>
    <div class="skin-msg" id="skin-msg"></div>
    <div class="skin-grid" id="skin-grid"></div>
    <button class="close-btn" id="skin-close">返回遊戲</button>
  </div>
</div>

<script>
  const W = 800, H = 220, GROUND = 190, S = 2; // S = 像素縮放
  const FG = '#535353', BG = '#f7f7f7';
  const VERSION = '1.5.0';

  // ---------- 造型 ----------
  const SKINS = [
    { id: 'classic', name: '經典', color: FG,        price: 0 },
    { id: 'red',     name: '紅',   color: '#e53935', price: 10 },
    { id: 'blue',    name: '藍',   color: '#1e88e5', price: 10 },
    { id: 'green',   name: '綠',   color: '#43a047', price: 10 },
    { id: 'orange',  name: '橙',   color: '#fb8c00', price: 10 },
    { id: 'yellow',  name: '黃',   color: '#fbc02d', price: 10 },
    { id: 'purple',  name: '紫',   color: '#8e24aa', price: 10 },
  ];
  // 解鎖狀態和造型選擇都不保存，重新整理就回到只有經典造型
  const unlocked = new Set(['classic']);
  let skin = SKINS[0];
  localStorage.removeItem('dino-skin'); // 清掉舊版存下來的造型選擇

  // 夜晚時整個 canvas 會被 invert，先把顏色反轉一次，顯示出來才會是原本的顏色
  function invertColor(hex) {
    const n = 0xffffff - parseInt(hex.slice(1), 16);
    return '#' + n.toString(16).padStart(6, '0');
  }
  function nightSafe(hex) {
    return canvas.classList.contains('night') ? invertColor(hex) : hex;
  }
  function dinoColor() {
    return skin.id === 'classic' ? skin.color : nightSafe(skin.color);
  }

  const skinPage = document.getElementById('skin-page');
  const skinGrid = document.getElementById('skin-grid');
  const skinOpenBtn = document.getElementById('skin-open');

  function setSkin(s) {
    if (!unlocked.has(s.id)) return;
    skin = s;
    skinOpenBtn.innerHTML = `🎨 造型：<span class="dot" style="background:${s.color}"></span>${s.name}`;
    skinGrid.querySelectorAll('.skin-card').forEach(c =>
      c.classList.toggle('active', c.dataset.skin === s.id));
  }
  setSkin(skin);

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // 站立恐龍身體（20x16 像素），腿另外畫
  const DINO_BODY = [
    '           ######## ',
    '          ## #######',
    '          ##########',
    '          ##########',
    '          #####     ',
    '          ########  ',
    '#        #####      ',
    '#       #######     ',
    '##    ##########    ',
    '###  ############   ',
    '################    ',
    '################    ',
    ' ##############     ',
    '  ############      ',
    '   ##########       ',
    '    ########        ',
  ];

  // ---------- 音效 ----------
  let audio = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.05) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain).connect(audio.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      osc.stop(audio.currentTime + dur);
    } catch (e) { /* 不支援就靜音 */ }
  }

  // ---------- 遊戲狀態 ----------
  let state = 'ready'; // ready | running | over
  let dino, obstacles, clouds, bumps, speed, score, spawnTimer, frame;
  let milestone, flashTimer, nextNight, overAt;
  let coins, coinTimer, runCoins, popups;
  let hi = Number(localStorage.getItem('dino-hi') || 0);
  // 累計金幣只在這次開啟網頁期間跨局累積，重新整理就歸零
  let totalCoins = 0;
  localStorage.removeItem('dino-coins'); // 清掉舊版存下來的金幣
  const keys = { jump: false, down: false };

  function reset() {
    dino = { x: 50, y: GROUND - 44, w: 40, h: 44, vy: 0, onGround: true, ducking: false };
    obstacles = [];
    coins = [];
    coinTimer = 120;
    runCoins = 0;
    popups = [];
    speed = 6;
    score = 0;
    spawnTimer = 60;
    frame = 0;
    milestone = 0;
    flashTimer = 0;
    nextNight = 700;
    canvas.classList.remove('night');
    clouds = [{ x: 200, y: 50 }, { x: 520, y: 30 }, { x: 740, y: 70 }];
    bumps = Array.from({ length: 30 }, () => ({
      x: Math.random() * W,
      y: GROUND - 1 + Math.random() * 18,
      w: 1 + Math.floor(Math.random() * 3),
    }));
  }

  function start() {
    reset();
    state = 'running';
  }

  function jump() {
    if (dino.onGround && !keys.down) {
      dino.vy = -12;
      dino.onGround = false;
      beep(600, 0.06);
    }
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    beep(150, 0.3, 'sawtooth', 0.06);
    if (Math.floor(score) > hi) {
      hi = Math.floor(score);
      localStorage.setItem('dino-hi', hi);
    }
  }

  // ---------- 障礙物 ----------
  function spawn() {
    // 金幣還沒完全進場就先等一下，避免障礙物跟金幣疊在一起
    if (coins.some(c => c.x > W - 60)) { spawnTimer = 10; return; }
    if (score > 300 && Math.random() < 0.25) {
      // 翼龍：低（要跳）、中（要蹲或跳）、高（直接過）
      const heights = [GROUND - 30, GROUND - 58, GROUND - 100];
      const y = heights[Math.floor(Math.random() * heights.length)];
      obstacles.push({ type: 'bird', x: W + 10, y, w: 46, h: 26 });
    } else {
      const large = Math.random() < 0.5;
      const n = 1 + Math.floor(Math.random() * (speed > 8 ? 3 : 2));
      const cw = large ? 25 : 17, ch = large ? 50 : 35;
      obstacles.push({ type: 'cactus', x: W + 10, y: GROUND - ch, w: cw * n, h: ch, n, cw });
    }
    spawnTimer = (380 + speed * 18 + Math.random() * 350) / speed;
  }

  // ---------- 金幣 ----------
  function spawnCoins() {
    coinTimer = (500 + Math.random() * 500) / speed;
    if (obstacles.some(o => o.x + o.w > W - 120)) { coinTimer = 15; return; }
    const n = 3 + Math.floor(Math.random() * 3);
    const high = Math.random() < 0.5;
    for (let i = 0; i < n; i++) {
      // 高處的金幣排成弧形，要跳起來才吃得到
      const arc = high ? Math.sin(i / (n - 1) * Math.PI) * 25 : 0;
      coins.push({ x: W + 10 + i * 28, y: (high ? GROUND - 95 : GROUND - 30) - arc, r: 8, phase: i * 0.6 });
    }
  }

  function collectCoin(c) {
    runCoins++;
    totalCoins++;
    popups.push({ x: c.x, y: c.y - 10, t: 30 });
    beep(1300, 0.05, 'square', 0.04);
    setTimeout(() => beep(1750, 0.08, 'square', 0.04), 50);
  }

  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------- 更新 ----------
  function update(dt) {
    frame += dt;
    speed = Math.min(6 + score * 0.004, 14);
    score += speed * dt * 0.025;

    // 每 100 分提示
    if (Math.floor(score / 100) > milestone) {
      milestone = Math.floor(score / 100);
      flashTimer = 60;
      beep(900, 0.1);
    }
    if (flashTimer > 0) flashTimer -= dt;

    // 日夜切換
    if (score >= nextNight) {
      canvas.classList.toggle('night');
      nextNight += 700;
    }

    // 恐龍
    if (dino.onGround) dino.ducking = keys.down;
    dino.w = dino.ducking ? 54 : 40;
    dino.h = dino.ducking ? 26 : 44;
    if (dino.onGround) {
      dino.y = GROUND - dino.h;
    } else {
      dino.vy += (keys.down ? 1.8 : 0.6) * dt;
      dino.y += dino.vy * dt;
      if (dino.y + dino.h >= GROUND) {
        dino.y = GROUND - dino.h;
        dino.vy = 0;
        dino.onGround = true;
      }
    }

    // 障礙物
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawn();
    obstacles.forEach(o => { o.x -= (o.type === 'bird' ? speed + 0.5 : speed) * dt; });
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // 金幣
    coinTimer -= dt;
    if (coinTimer <= 0) spawnCoins();
    const body = { x: dino.x, y: dino.y, w: dino.w, h: dino.h };
    coins = coins.filter(c => {
      c.x -= speed * dt;
      if (hit(body, { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 })) {
        collectCoin(c);
        return false;
      }
      return c.x > -20;
    });
    popups.forEach(p => { p.y -= 0.8 * dt; p.t -= dt; });
    popups = popups.filter(p => p.t > 0);

    // 雲 & 地面
    clouds.forEach(c => { c.x -= speed * 0.2 * dt; });
    clouds = clouds.filter(c => c.x > -60);
    if (clouds.length === 0 || clouds[clouds.length - 1].x < W - 200 - Math.random() * 300) {
      clouds.push({ x: W + 20, y: 20 + Math.random() * 60 });
    }
    bumps.forEach(b => {
      b.x -= speed * dt;
      if (b.x < -5) { b.x = W + Math.random() * 50; b.y = GROUND - 1 + Math.random() * 18; }
    });

    // 碰撞（判定框稍微縮小，比較公平）
    const db = { x: dino.x + 6, y: dino.y + 4, w: dino.w - 12, h: dino.h - 8 };
    for (const o of obstacles) {
      if (hit(db, { x: o.x + 3, y: o.y + 3, w: o.w - 6, h: o.h - 6 })) {
        gameOver();
        break;
      }
    }
  }

  // ---------- 繪圖 ----------
  function drawDino() {
    const { x, y } = dino;
    const px = (c, r, w = 1, h = 1) => ctx.fillRect(x + c * S, y + r * S, w * S, h * S);
    const running = state === 'running' && dino.onGround;
    const step = Math.floor(frame / 5) % 2;
    const color = dinoColor();
    ctx.fillStyle = color;

    const leg = (c, top, short) => {
      if (short) { px(c, top, 2, 2); px(c, top + 2, 3, 1); }
      else { px(c, top, 2, 5); px(c, top + 5, 3, 1); }
    };

    if (dino.ducking) {
      px(0, 1, 1, 2); px(1, 2, 2, 3);  // 尾巴
      px(3, 1, 15, 7);                 // 身體
      px(17, 0, 10, 5);                // 頭
      px(17, 5, 6, 1);
      ctx.fillStyle = BG; px(19, 1);   // 眼睛
      ctx.fillStyle = color;
      // 蹲下時腿只有 4 列高
      const dl = (c, short) => short ? (px(c, 8, 2, 2), px(c, 10, 3, 1)) : (px(c, 8, 2, 4), px(c, 12, 3, 1));
      dl(6, running && step === 1);
      dl(12, running && step === 0);
      return;
    }

    DINO_BODY.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) if (row[c] === '#') px(c, r);
    });

    if (state === 'over') {
      // 死掉時的 X 眼
      ctx.fillStyle = BG; px(11, 0, 3, 3);
      ctx.fillStyle = color; px(11, 0); px(13, 0); px(12, 1); px(11, 2); px(13, 2);
    }

    leg(5, 16, running && step === 1);
    leg(10, 16, running && step === 0);
  }

  function drawCactus(x, y, w, h) {
    const tw = Math.round(w * 0.4), tx = x + Math.round((w - tw) / 2);
    const aw = Math.max(3, Math.round(w * 0.22));
    ctx.fillRect(tx, y, tw, h);                                   // 主幹
    ctx.fillRect(x, y + h * 0.3, aw, h * 0.25 + aw);              // 左臂
    ctx.fillRect(x, y + h * 0.55, tx - x, aw);
    ctx.fillRect(x + w - aw, y + h * 0.2, aw, h * 0.25 + aw);     // 右臂
    ctx.fillRect(tx + tw, y + h * 0.45, x + w - (tx + tw), aw);
  }

  function tri(ax, ay, bx, by, cx, cy) {
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy);
    ctx.fill();
  }

  function drawBird(o) {
    const { x, y } = o;
    const up = Math.floor(frame / 12) % 2 === 0;
    ctx.fillRect(x + 12, y + 11, 24, 7);           // 身體
    ctx.fillRect(x + 6, y + 9, 10, 6);             // 頭
    tri(x + 6, y + 10, x, y + 13, x + 6, y + 14);  // 嘴
    tri(x + 36, y + 12, x + 46, y + 10, x + 36, y + 17); // 尾
    if (up) tri(x + 16, y + 12, x + 30, y + 12, x + 20, y);
    else tri(x + 16, y + 17, x + 30, y + 17, x + 22, y + 28);
    ctx.fillStyle = BG;
    ctx.fillRect(x + 9, y + 10, 2, 2);             // 眼睛
    ctx.fillStyle = FG;
  }

  function drawCoin(x, y, r, phase, spinning = true) {
    // 用寬度縮放做出旋轉的效果
    const w = spinning ? Math.max(1.5, Math.abs(Math.cos(frame / 8 + phase)) * r) : r;
    ctx.fillStyle = nightSafe('#f9a825');
    ctx.beginPath(); ctx.ellipse(x, y, w, r, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = nightSafe('#fdd835');
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.55, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawCloud(c) {
    ctx.fillStyle = '#d8d8d8';
    ctx.fillRect(c.x + 12, c.y, 18, 5);
    ctx.fillRect(c.x + 6, c.y + 5, 32, 5);
    ctx.fillRect(c.x, c.y + 10, 46, 5);
  }

  function draw() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    clouds.forEach(drawCloud);

    // 地面
    ctx.fillStyle = FG;
    ctx.fillRect(0, GROUND - 4, W, 1);
    bumps.forEach(b => ctx.fillRect(b.x, b.y, b.w, 1));

    obstacles.forEach(o => {
      if (o.type === 'bird') drawBird(o);
      else for (let i = 0; i < o.n; i++) drawCactus(o.x + i * o.cw, o.y, o.cw - 2, o.h);
    });

    coins.forEach(c => drawCoin(c.x, c.y, c.r, c.phase));

    drawDino();

    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    popups.forEach(p => {
      ctx.fillStyle = nightSafe('#f9a825');
      ctx.fillText('+1', p.x, p.y);
    });

    // 累計金幣（左上角，停在原地不轉），會延續到下一局
    drawCoin(22, 24, 8, 0, false);
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = FG;
    const coinText = '× ' + totalCoins;
    ctx.fillText(coinText, 36, 30);
    if (runCoins > 0) {
      const tw = ctx.measureText(coinText).width;
      ctx.font = '14px "Courier New", monospace';
      ctx.fillStyle = '#888';
      ctx.fillText('(+' + runCoins + ')', 36 + tw + 6, 30);
    }

    // 版本號
    ctx.font = '12px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#aaa';
    ctx.fillText('v' + VERSION, 10, H - 8);

    // 分數
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textAlign = 'right';
    const pad = n => String(Math.floor(n)).padStart(5, '0');
    const showScore = flashTimer <= 0 || Math.floor(flashTimer / 8) % 2 === 0;
    const shown = flashTimer > 0 ? milestone * 100 : score;
    ctx.fillStyle = '#888';
    ctx.fillText('HI ' + pad(hi), W - 90, 30);
    ctx.fillStyle = FG;
    if (showScore) ctx.fillText(pad(shown), W - 16, 30);

    ctx.textAlign = 'center';
    if (state === 'ready') {
      ctx.font = '18px "Microsoft JhengHei", sans-serif';
      ctx.fillText('按空白鍵或點擊畫面開始', W / 2, 95);
    } else if (state === 'over') {
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.fillText('G A M E   O V E R', W / 2, 75);
      ctx.font = '16px "Microsoft JhengHei", sans-serif';
      ctx.fillText(`本局 +${runCoins} 金幣　累計金幣 ${totalCoins}`, W / 2, 106);
      ctx.fillText('按空白鍵或點擊畫面重新開始', W / 2, 132);
    }
  }

  // ---------- 造型頁面 ----------
  let skinPageOpen = false;

  function drawSkinPreview(cv, color) {
    const pw = 80, ph = 64, ox = 20, oy = ph - 6 - 44;
    cv.width = pw * dpr;
    cv.height = ph * dpr;
    const p = cv.getContext('2d');
    p.scale(dpr, dpr);
    p.fillStyle = BG;
    p.fillRect(0, 0, pw, ph);
    p.fillStyle = FG;
    p.fillRect(0, ph - 10, pw, 1); // 地面
    p.fillStyle = color;
    const px = (c, r, w = 1, h = 1) => p.fillRect(ox + c * S, oy + r * S, w * S, h * S);
    DINO_BODY.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) if (row[c] === '#') px(c, r);
    });
    px(5, 16, 2, 5); px(5, 21, 3, 1);
    px(10, 16, 2, 5); px(10, 21, 3, 1);
  }

  const skinCoins = document.getElementById('skin-coins');
  const skinMsg = document.getElementById('skin-msg');

  function showSkinMsg(text, type) {
    skinMsg.textContent = text;
    skinMsg.className = 'skin-msg ' + type;
  }

  function renderSkinPage() {
    skinCoins.textContent = `持有金幣：🪙 ${totalCoins}`;
    skinGrid.innerHTML = '';
    SKINS.forEach((s, i) => {
      const owned = unlocked.has(s.id);
      const card = document.createElement('button');
      card.className = 'skin-card' + (s.id === skin.id ? ' active' : '') + (owned ? '' : ' locked');
      card.dataset.skin = s.id;
      const cv = document.createElement('canvas');
      drawSkinPreview(cv, s.color);
      const label = document.createElement('div');
      label.className = 'skin-name';
      label.innerHTML = owned
        ? `${s.name} <kbd>${i + 1}</kbd>`
        : `${s.name} <span class="price">🪙 ${s.price}</span>`;
      card.append(cv, label);
      card.addEventListener('click', () => (owned ? setSkin(s) : buySkin(s, card)));
      skinGrid.appendChild(card);
    });
  }

  function buySkin(s, card) {
    if (totalCoins < s.price) {
      showSkinMsg(`金幣不足，解鎖「${s.name}」還差 ${s.price - totalCoins} 枚`, 'error');
      card.classList.remove('shake');
      void card.offsetWidth; // 讓動畫可以重播
      card.classList.add('shake');
      beep(200, 0.15, 'square', 0.04);
      return;
    }
    totalCoins -= s.price;
    unlocked.add(s.id);
    setSkin(s);
    renderSkinPage();
    showSkinMsg(`🎉 解鎖成功！已換上「${s.name}」造型`, 'ok');
    beep(1000, 0.08);
    setTimeout(() => beep(1500, 0.12), 80);
  }

  function openSkinPage() {
    showSkinMsg('', '');
    renderSkinPage();
    skinPage.hidden = false;
    skinPageOpen = true;
    keys.down = false;
  }

  function closeSkinPage() {
    skinPage.hidden = true;
    skinPageOpen = false;
    document.activeElement.blur(); // 避免空白鍵又按到按鈕
  }

  skinOpenBtn.addEventListener('click', openSkinPage);
  document.getElementById('skin-close').addEventListener('click', closeSkinPage);
  skinPage.addEventListener('click', e => { if (e.target === skinPage) closeSkinPage(); });

  // ---------- 主迴圈 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 16.667, 3);
    last = now;
    if (state === 'running' && !skinPageOpen) update(dt); // 造型頁面打開時暫停
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 操作 ----------
  function pressJump() {
    keys.jump = true;
    if (state === 'ready') start();
    else if (state === 'running') jump();
    else if (state === 'over' && performance.now() - overAt > 500) start();
  }
  function releaseJump() {
    keys.jump = false;
    // 提早放開 = 跳比較低
    if (state === 'running' && !dino.onGround && dino.vy < -5) dino.vy = -5;
  }

  document.addEventListener('keydown', e => {
    const skinKey = /^Digit[1-9]$/.test(e.code) && SKINS[Number(e.code.slice(5)) - 1];
    if (skinKey) {
      setSkin(skinKey);
      return;
    }
    if (skinPageOpen) {
      if (e.code === 'Escape') closeSkinPage();
      return;
    }
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) pressJump();
    } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
      e.preventDefault();
      keys.down = true;
    }
  });
  document.addEventListener('keyup', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) releaseJump();
    else if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); pressJump(); });
  canvas.addEventListener('pointerup', releaseJump);

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
